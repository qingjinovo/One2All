name: one2all
description: Cross-platform device interconnection app for file, message, and data sharing.
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_webrtc: ^0.14.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  uuid: ^4.0.0
  json_annotation: ^4.8.0
  intl: any


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  generate: true
  uses-material-design: true
